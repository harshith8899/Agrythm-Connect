# Render blueprint for the Gate Zero API. See gate0/docs/DEPLOY.md.
# One instance only: the daily scheduler (daily send, retries, callbacks) runs inside the process. Data lives in Supabase.
services:
  - type: web
    name: agrythm-gate0-api
    runtime: python
    region: singapore            # closest to India
    plan: starter                # always on: the scheduler and callbacks need that
    rootDir: gate0/backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m weathercall.server
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass   # deploys a commit only after its GitHub checks (CI) pass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GATE0_API_HOST
        value: 0.0.0.0
      - key: GATE0_WEATHER
        value: open_meteo
      - key: GATE0_TELEPHONY
        value: sarvam_agent
      - key: SARVAM_APP_VERSION
        value: "10"
      # Secrets and ids: filled in the Render dashboard, never committed.
      - key: GATE0_DATABASE_URL        # the Supabase Session pooler address, with the password in it
        sync: false
      - key: GATE0_API_TOKEN
        sync: false
      - key: SARVAM_AGENT_API_KEY
        sync: false
      - key: SARVAM_ORG_ID
        sync: false
      - key: SARVAM_WORKSPACE_ID
        sync: false
      - key: SARVAM_APP_ID
        sync: false
      - key: SARVAM_CONNECTION_ID
        sync: false
      - key: SARVAM_AGENT_PHONE
        sync: false
